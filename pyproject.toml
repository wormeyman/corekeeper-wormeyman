[project]
name = "corekeeper-wormeyman"
version = "0.1.0"
description = "Core Keeper notes, BuildingBlueprint blueprints and read-only tools for the game's code"
requires-python = ">=3.14"
# The scripts in tools/ are standalone uv scripts with their own PEP 723 blocks.
# These copies are here so the type checker can see the libraries they import.
dependencies = [
    "dnfile>=0.17,<0.18",
    "UnityPy>=1.25,<2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.1,<2",
    "ruff>=0.17.4,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "C4", "SIM", "PERF", "RET", "PL", "C90", "PTH", "ARG", "ANN", "PGH", "RUF", "S"]

[tool.pyrefly]
preset = "strict"
project-includes = ["tools/**/*.py"]
# tools/blueprints/*.py import their neighbour bplib.py, as `uv run` puts the script's folder on sys.path
enable-fallback-search-path = true
